<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated;">
  <!-- Aura maldita tenue (menor que la del ganador) -->
  <ellipse cx="32" cy="38" rx="24" ry="22" fill="#a855f7" opacity="0.12"/>
  <ellipse cx="32" cy="38" rx="18" ry="16" fill="#7c3aed" opacity="0.15"/>

  <!-- Rayo de maldición (solo uno, el ganador tiene dos) -->
  <polygon points="10,46 14,46 11,54 16,54 9,62 12,54 7,54" fill="#4ade80" opacity="0.8"/>

  <!-- Calavera agrietada, sin corona -->
  <g>
    <!-- cráneo -->
    <rect x="20" y="24" width="24" height="18" rx="6" fill="#cfc8b8"/>
    <rect x="20" y="24" width="24" height="18" rx="6" fill="none" stroke="#1a1c3f" stroke-width="2"/>
    <!-- grieta -->
    <polyline points="34,24 31,29 34,32 30,36" fill="none" stroke="#1a1c3f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- mandíbula -->
    <rect x="25" y="40" width="14" height="8" rx="2" fill="#cfc8b8" stroke="#1a1c3f" stroke-width="2"/>
    <line x1="29" y1="42" x2="29" y2="47" stroke="#1a1c3f" stroke-width="1.5"/>
    <line x1="32" y1="42" x2="32" y2="47" stroke="#1a1c3f" stroke-width="1.5"/>
    <line x1="35" y1="42" x2="35" y2="47" stroke="#1a1c3f" stroke-width="1.5"/>
    <!-- ojos morados apagados (maldición sufrida, no dominada) -->
    <rect x="24" y="30" width="7" height="8" rx="2" fill="#1a1c3f"/>
    <rect x="33" y="30" width="7" height="8" rx="2" fill="#1a1c3f"/>
    <rect x="25.5" y="32.5" width="4" height="4" fill="#a855f7"/>
    <rect x="34.5" y="32.5" width="4" height="4" fill="#a855f7"/>
    <!-- nariz -->
    <polygon points="32,37 30,39.5 34,39.5" fill="#1a1c3f"/>
  </g>

  <!-- Corona rota / caída al costado (participó, no reinó) -->
  <g opacity="0.9" transform="rotate(24 50 14)">
    <polygon points="43,18 43,8 47,12 50,6 53,12 57,8 57,18" fill="#78716c" stroke="#44403c" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="43" y="16" width="14" height="3" rx="1" fill="#57534e"/>
  </g>

  <!-- Banda IV gris -->
  <g>
    <rect x="22" y="50" width="20" height="9" rx="2" fill="#111827" stroke="#78716c" stroke-width="1.5"/>
    <text x="32" y="57.5" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="7" fill="#a8a29e">IV</text>
  </g>
</svg>
