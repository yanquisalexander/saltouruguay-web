<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated;">
  <!-- Aura maldita -->
  <ellipse cx="32" cy="36" rx="26" ry="24" fill="#a855f7" opacity="0.18"/>
  <ellipse cx="32" cy="36" rx="20" ry="18" fill="#7c3aed" opacity="0.22"/>

  <!-- Rayos de maldición (Extremito) -->
  <polygon points="10,44 14,44 11,52 16,52 9,62 12,52 7,52" fill="#4ade80"/>
  <polygon points="54,44 50,44 53,52 48,52 55,62 52,52 57,52" fill="#4ade80"/>

  <!-- Calavera -->
  <g>
    <!-- cráneo -->
    <rect x="20" y="24" width="24" height="18" rx="6" fill="#e8e0d0"/>
    <rect x="20" y="24" width="24" height="18" rx="6" fill="none" stroke="#1a1c3f" stroke-width="2"/>
    <!-- mandíbula -->
    <rect x="25" y="40" width="14" height="8" rx="2" fill="#e8e0d0" stroke="#1a1c3f" stroke-width="2"/>
    <line x1="29" y1="42" x2="29" y2="47" stroke="#1a1c3f" stroke-width="1.5"/>
    <line x1="32" y1="42" x2="32" y2="47" stroke="#1a1c3f" stroke-width="1.5"/>
    <line x1="35" y1="42" x2="35" y2="47" stroke="#1a1c3f" stroke-width="1.5"/>
    <!-- ojos malditos (verdes, brillantes) -->
    <rect x="24" y="30" width="7" height="8" rx="2" fill="#1a1c3f"/>
    <rect x="33" y="30" width="7" height="8" rx="2" fill="#1a1c3f"/>
    <rect x="25.5" y="32" width="4" height="4" fill="#22ff88"/>
    <rect x="34.5" y="32" width="4" height="4" fill="#22ff88"/>
    <rect x="26.5" y="33" width="2" height="2" fill="#dcffe8"/>
    <rect x="35.5" y="33" width="2" height="2" fill="#dcffe8"/>
    <!-- nariz -->
    <polygon points="32,37 30,39.5 34,39.5" fill="#1a1c3f"/>
  </g>

  <!-- Corona de ganador (oro) -->
  <g>
    <polygon points="20,22 20,10 26,15 32,7 38,15 44,10 44,22" fill="#fbbf24" stroke="#92400e" stroke-width="2" stroke-linejoin="round"/>
    <rect x="20" y="20" width="24" height="4" rx="1" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
    <circle cx="20" cy="10" r="2" fill="#ef4444" stroke="#7f1d1d" stroke-width="1"/>
    <circle cx="32" cy="7" r="2.2" fill="#22d3ee" stroke="#0e7490" stroke-width="1"/>
    <circle cx="44" cy="10" r="2" fill="#ef4444" stroke="#7f1d1d" stroke-width="1"/>
    <rect x="30" y="13" width="4" height="4" fill="#92400e" opacity="0.6"/>
  </g>

  <!-- Banda IV -->
  <g>
    <rect x="22" y="50" width="20" height="9" rx="2" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="32" y="57.5" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="7" fill="#fbbf24">IV</text>
  </g>
</svg>
